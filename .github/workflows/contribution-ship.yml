name: Generate Contribution Ship

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install Pillow requests

      - name: Verify ship image
        run: |
          if [ ! -f "ahmed-ehab-ship.png" ]; then
            echo "Ship image not found!"
            exit 1
          fi

      - name: Generate contribution ship
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python generate_contribution_ship.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution-ship.gif
          git commit -m "Update contribution ship" || echo "No changes"
          git push